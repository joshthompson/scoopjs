name: Release

# On every push to main: opens (or updates) the "Version Packages" PR while
# there are changesets waiting, and publishes to GitHub Packages once that PR
# is merged.
#
# Publishes with this repo's own GITHUB_TOKEN, so there's no secret to set
# up: the first release creates the package. See plan.md, "Publishing".

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing goes out that CI wouldn't pass.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The token for GitHub Packages. Each package's `publishConfig.registry`
      # sends it there rather than to npm.
      - name: Log in to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
